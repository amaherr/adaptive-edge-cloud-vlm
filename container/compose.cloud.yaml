services:
  inference:
    image: ${APP_IMAGE:?Set the shared ECR repository@sha256 digest}
    environment:
      ADAPTIVE_VLM_HEARTBEAT: /artifacts/job.heartbeat
      APP_IMAGE: ${APP_IMAGE:?Set shared immutable digest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    init: true
    stop_grace_period: 180s
    volumes:
      - ${MODEL_DIR:?Set persistent model directory}:/models
      - ${DATA_DIR:?Set frozen dataset directory}:/app/data:ro
      - ${ARTIFACT_DIR:?Set persistent artifact directory}:/artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["adaptive-server", "--config", "configs/experiments/cloud_vqa_v1.yaml", "--artifact-manifest", "configs/model/moondream2_artifact.yaml", "--cache-dir", "/models", "--device", "cuda:0", "--offline", "--bind-host", "10.42.1.20"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('10.42.1.20',5050),timeout=3).close()"]
      interval: 60s
      timeout: 5s
      start_period: 300s
      retries: 3
  iperf:
    image: ${APP_IMAGE:?Set the shared ECR repository@sha256 digest}
    environment:
      ADAPTIVE_VLM_HEARTBEAT: /artifacts/job.heartbeat
      APP_IMAGE: ${APP_IMAGE:?Set shared immutable digest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    init: true
    stop_grace_period: 180s
    volumes:
      - ${MODEL_DIR:?Set persistent model directory}:/models
      - ${DATA_DIR:?Set frozen dataset directory}:/app/data:ro
      - ${ARTIFACT_DIR:?Set persistent artifact directory}:/artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["iperf3"]
    command: ["-s", "-B", "10.42.1.20", "-p", "5051"]
    restart: unless-stopped
  echo:
    image: ${APP_IMAGE:?Set the shared ECR repository@sha256 digest}
    environment:
      ADAPTIVE_VLM_HEARTBEAT: /artifacts/job.heartbeat
      APP_IMAGE: ${APP_IMAGE:?Set shared immutable digest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    init: true
    stop_grace_period: 180s
    volumes:
      - ${MODEL_DIR:?Set persistent model directory}:/models
      - ${DATA_DIR:?Set frozen dataset directory}:/app/data:ro
      - ${ARTIFACT_DIR:?Set persistent artifact directory}:/artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["python", "scripts/tcp_rtt_probe.py"]
    command: ["server", "--bind-host", "10.42.1.20", "--port", "5052"]
    restart: unless-stopped
