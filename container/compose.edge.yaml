services:
  benchmark:
    image: ${APP_IMAGE:?Set the shared ECR repository@sha256 digest}
    environment:
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_MODULES_CACHE: /models/modules
      XDG_CACHE_HOME: /artifacts/runtime-cache
      CUDA_CACHE_PATH: /artifacts/runtime-cache/cuda
      TRITON_CACHE_DIR: /artifacts/runtime-cache/triton
      TORCH_HOME: /artifacts/runtime-cache/torch
      ADAPTIVE_VLM_HEARTBEAT: /artifacts/job.heartbeat
      APP_IMAGE: ${APP_IMAGE:?Set shared immutable digest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    init: true
    stop_grace_period: 180s
    volumes:
      - ${MODEL_DIR:?Set persistent model directory}:/models:ro
      - ${ARTIFACT_DIR:?Set persistent artifact directory}/runtime-cache/modules:/models/modules
      - ${DATA_DIR:?Set frozen dataset directory}:/app/data:ro
      - ${ARTIFACT_DIR:?Set persistent artifact directory}:/artifacts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - benchmark
      - --config
      - configs/experiments/cloud_vqa_v1.yaml
      - --mode
      - ${PLACEMENT:-edge}
      - --manifest
      - ${MANIFEST_PATH:?Set verified smoke or campaign manifest path inside container}
      - --run-dir
      - /artifacts/${RUN_ID:?Set a unique run ID}
      - --artifact-manifest
      - configs/model/moondream2_artifact.yaml
      - --cache-dir
      - /models
      - --vision-device
      - cuda:0
      - --text-device
      - cuda:0
      - --offline
    restart: "no"
