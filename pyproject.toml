[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-edge-cloud-vlm"
version = "0.1.0"
description = "Reproducible edge-cloud execution baselines for vision-language models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Abdelrahman Maher" },
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
adaptive-vlm = "adaptive_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_vlm = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["adaptive_vlm"]
omit = ["*/adaptive_vlm/models/moondream.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
omit = ["*/adaptive_vlm/models/moondream.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adaptive_vlm"]

