<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="title desc">
<title id="title">Selecting per request removes the regret of any fixed choice</title>
<desc id="desc">Grouped horizontal bars: mean regret against the per-request oracle on the G4 evaluation cells, by load state, for the selector, always-cloud and always-edge.</desc>

<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .on-fill { fill: #ffffff; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ring { stroke: #fcfcfb; }
  .f-cloud { fill: #2a78d6; } .k-cloud { stroke: #2a78d6; }
  .f-edge { fill: #eb6834; } .k-edge { stroke: #eb6834; }
  .f-synchronous { fill: #1baf7a; } .k-synchronous { stroke: #1baf7a; }
  .f-int8 { fill: #eda100; } .k-int8 { stroke: #eda100; }
  .f-prompt_first { fill: #e87ba4; } .k-prompt_first { stroke: #e87ba4; }
  .f-adaptive { fill: #6250d6; } .k-adaptive { stroke: #6250d6; }
  .f-neutral { fill: #898781; } .k-neutral { stroke: #898781; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .ring { stroke: #1a1a19; }
    .f-cloud { fill: #3987e5; } .k-cloud { stroke: #3987e5; }
    .f-edge { fill: #d95926; } .k-edge { stroke: #d95926; }
    .f-synchronous { fill: #199e70; } .k-synchronous { stroke: #199e70; }
    .f-int8 { fill: #c98500; } .k-int8 { stroke: #c98500; }
    .f-prompt_first { fill: #d55181; } .k-prompt_first { stroke: #d55181; }
    .f-adaptive { fill: #9085e9; } .k-adaptive { stroke: #9085e9; }
    .f-neutral { fill: #898781; } .k-neutral { stroke: #898781; }
  }
</style>

<rect class="surface" width="960" height="448"/>
