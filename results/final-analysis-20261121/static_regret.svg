<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" width="900" height="342" role="img" aria-labelledby="title desc">
<title id="title">Always-cloud is the best static policy, but still loses where loads bite</title>
<desc id="desc">Horizontal bars: mean regret against the per-cell measured oracle for each static configuration over the 54 G2 v2+ training cells.</desc>

<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .on-fill { fill: #ffffff; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ring { stroke: #fcfcfb; }
  .f-cloud { fill: #2a78d6; } .k-cloud { stroke: #2a78d6; }
  .f-edge { fill: #eb6834; } .k-edge { stroke: #eb6834; }
  .f-synchronous { fill: #1baf7a; } .k-synchronous { stroke: #1baf7a; }
  .f-int8 { fill: #eda100; } .k-int8 { stroke: #eda100; }
  .f-prompt_first { fill: #e87ba4; } .k-prompt_first { stroke: #e87ba4; }
  .f-adaptive { fill: #6250d6; } .k-adaptive { stroke: #6250d6; }
  .f-neutral { fill: #898781; } .k-neutral { stroke: #898781; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .ring { stroke: #1a1a19; }
    .f-cloud { fill: #3987e5; } .k-cloud { stroke: #3987e5; }
    .f-edge { fill: #d95926; } .k-edge { stroke: #d95926; }
    .f-synchronous { fill: #199e70; } .k-synchronous { stroke: #199e70; }
    .f-int8 { fill: #c98500; } .k-int8 { stroke: #c98500; }
    .f-prompt_first { fill: #d55181; } .k-prompt_first { stroke: #d55181; }
    .f-adaptive { fill: #9085e9; } .k-adaptive { stroke: #9085e9; }
    .f-neutral { fill: #898781; } .k-neutral { stroke: #898781; }
  }
</style>

<rect class="surface" width="900" height="342"/>
<text x="24.0" y="32.0" class="ink" font-size="16" font-weight="600">Always-cloud is the best static policy, but still loses where loads bite</text>
<text x="24.0" y="52.0" class="ink2" font-size="12">G2 v2+ training cells (54); regret = the static choice's median latency minus the fastest configuration's, per cell.</text>
<line class="grid" x1="190.0" y1="88.0" x2="190.0" y2="276.0"/>
<text x="190.0" y="292.0" class="muted" font-size="10" text-anchor="middle">0</text>
<line class="grid" x1="264.3" y1="88.0" x2="264.3" y2="276.0"/>
<text x="264.3" y="292.0" class="muted" font-size="10" text-anchor="middle">200</text>
<line class="grid" x1="338.6" y1="88.0" x2="338.6" y2="276.0"/>
<text x="338.6" y="292.0" class="muted" font-size="10" text-anchor="middle">400</text>
<line class="grid" x1="412.9" y1="88.0" x2="412.9" y2="276.0"/>
<text x="412.9" y="292.0" class="muted" font-size="10" text-anchor="middle">600</text>
<line class="grid" x1="487.1" y1="88.0" x2="487.1" y2="276.0"/>
<text x="487.1" y="292.0" class="muted" font-size="10" text-anchor="middle">800</text>
<line class="grid" x1="561.4" y1="88.0" x2="561.4" y2="276.0"/>
<text x="561.4" y="292.0" class="muted" font-size="10" text-anchor="middle">1000</text>
<line class="grid" x1="635.7" y1="88.0" x2="635.7" y2="276.0"/>
<text x="635.7" y="292.0" class="muted" font-size="10" text-anchor="middle">1200</text>
<line class="grid" x1="710.0" y1="88.0" x2="710.0" y2="276.0"/>
<text x="710.0" y="292.0" class="muted" font-size="10" text-anchor="middle">1400</text>
<text x="178.0" y="111.0" class="ink2" font-size="12" text-anchor="end">cloud/raw_image</text>
<path class="f-cloud" d="M190.0,96.0 h5.2 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-5.2 z"/>
<text x="207.2" y="111.0" class="ink" font-size="11">25 ms (2%), not best in 6 of 54 cells</text>
<text x="178.0" y="149.0" class="ink2" font-size="12" text-anchor="end">split, int8</text>
<path class="f-int8" d="M190.0,134.0 h294.2 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-294.2 z"/>
<text x="496.2" y="149.0" class="ink" font-size="11">803 ms (129%), not best in 54 of 54 cells</text>
<text x="178.0" y="187.0" class="ink2" font-size="12" text-anchor="end">edge/full</text>
<path class="f-edge" d="M190.0,172.0 h296.3 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-296.3 z"/>
<text x="498.3" y="187.0" class="ink" font-size="11">809 ms (135%), not best in 48 of 54 cells</text>
<text x="178.0" y="225.0" class="ink2" font-size="12" text-anchor="end">split, bf16</text>
<path class="f-synchronous" d="M190.0,210.0 h447.5 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-447.5 z"/>
<text x="649.5" y="225.0" class="ink" font-size="11">1216 ms (191%), not best in 54 of 54 cells</text>
<text x="178.0" y="263.0" class="ink2" font-size="12" text-anchor="end">split, prompt-first</text>
<path class="f-prompt_first" d="M190.0,248.0 h447.7 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-447.7 z"/>
<text x="649.7" y="263.0" class="ink" font-size="11">1216 ms (191%), not best in 54 of 54 cells</text>
<text x="450.0" y="312.0" class="muted" font-size="11" text-anchor="middle">Mean regret against the per-cell oracle (ms)</text>
</svg>
